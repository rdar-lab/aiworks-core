<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block subject %}{{ app_name }}{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f4f4f8; font-family: Arial, Helvetica, sans-serif; }
    .wrapper { width: 100%; background-color: #f4f4f8; padding: 32px 16px; box-sizing: border-box; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
    .header { background-color: #1a1a2e; padding: 32px 40px; text-align: center; }
    .header-logo { color: #ffffff; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; text-decoration: none; text-transform: uppercase; }
    .header-logo span { color: #3b82f6; }
    .content { padding: 40px 40px 32px; color: #333333; }
    .content h1 { font-size: 22px; font-weight: bold; color: #1a1a2e; margin: 0 0 16px; }
    .content p { font-size: 15px; line-height: 1.7; color: #555555; margin: 0 0 16px; }
    .token-box { background-color: #f0eeff; border: 2px dashed #6c63ff; border-radius: 8px; padding: 18px 24px; text-align: center; margin: 24px 0; }
    .token-box .token { font-size: 28px; font-weight: bold; color: #1a1a2e; letter-spacing: 6px; font-family: 'Courier New', Courier, monospace; }
    .btn-container { text-align: center; margin: 28px 0; }
    .btn { display: inline-block; background-color: #6c63ff; color: #ffffff !important; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }
    .divider { border: none; border-top: 1px solid #eeeeee; margin: 28px 0; }
    .footer { background-color: #f8f8fc; padding: 24px 40px; text-align: center; border-top: 1px solid #eeeeee; }
    .footer p { font-size: 12px; color: #aaaaaa; margin: 0 0 6px; line-height: 1.6; }
    .footer a { color: #6c63ff; text-decoration: none; }
    @media only screen and (max-width: 620px) {
      .content { padding: 28px 24px 20px; }
      .footer { padding: 20px 24px; }
      .header { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <!-- Header -->
      <div class="header">
        <span class="header-logo">{{ app_name }}</span>
      </div>

      <!-- Body -->
      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>You are receiving this email because you have an account on {{ app_name }}.</p>
        {% if site_url %}<p><a href="{{ site_url }}">{{ site_url }}</a></p>{% endif %}
        <p>&copy; {{ app_name }}. All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
